<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>B-Kit Recorder</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <h2>B-Kit Recorder <span class="badge">BETA</span></h2>
        <p class="desc">현재 화면에서 매뉴얼 생성을 위한 행동 녹화를 시작합니다.</p>
        
        <div class="status-box">
            <span id="status-indicator" class="indicator inactive"></span>
            <span id="status-text">녹화 대기 중</span>
        </div>

        <div class="button-group">
            <button id="start-btn" class="btn primary">녹화 시작</button>
            <button id="stop-btn" class="btn danger" disabled>녹화 중지</button>
        </div>

        <div class="actions-list" id="actions-list">
            <!-- 녹화된 액션들이 여기에 표시됨 -->
        </div>

        <button id="finish-btn" class="btn secondary" style="display:none; margin-top: 10px;">스튜디오로 전송하기</button>
    </div>
    <script src="popup.js"></script>
</body>
</html>
